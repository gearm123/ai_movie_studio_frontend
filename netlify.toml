# Same pattern as translate-chat-frontend (direct API URL, no proxy).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_BASE_URL = "https://ai-history-backend.onrender.com"
  VITE_SITE_URL = "https://gearmstudio.netlify.app"

# Render: CORS_ORIGINS=https://gearmstudio.netlify.app
# Netlify: VITE_BACKEND_API_KEY = same value as Render API_KEY
# Netlify UI env vars override this file — delete duplicate VITE_API_BASE_URL if set wrong.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
# Same pattern as translate-chat-frontend: bake API URL at build, SPA fallback only.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_BASE_URL = "https://ai-movie-studio-api.onrender.com"

# On Render set CORS_ORIGINS (or FRONTEND_URL) to https://gearmstudio.netlify.app (no trailing slash).

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

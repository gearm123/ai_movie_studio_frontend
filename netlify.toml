# Same pattern as translate-chat-frontend (direct API URL, custom Netlify domain — not *.netlify.app).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_BASE_URL = "https://ai-history-backend.onrender.com"

# translate-chat uses chatreconstruct.com + translate-chat-backend.onrender.com (not netlify.app).
# Add a custom domain on Netlify, then set Render CORS_ORIGINS to that origin exactly.
# Netlify: VITE_BACKEND_API_KEY = Render API_KEY

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
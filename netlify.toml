# Same pattern as translate-chat-frontend (direct API URL, no proxy).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_BASE_URL = "https://ai-movie-studio-backend.onrender.com"

# Render: CORS_ORIGINS=https://gearmstudio.netlify.app

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
